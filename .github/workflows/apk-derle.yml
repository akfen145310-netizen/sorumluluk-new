# GitHub'a yüklendiğinde APK'yı otomatik derler.
# Actions sekmesi > "APK Derle" > Run workflow > bitince Artifacts altından APK indirilir.
name: APK Derle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Debug APK derle
        run: gradle :app:assembleDebug --no-configuration-cache --stacktrace

      - name: Release APK derle (debug anahtarıyla imzalanır)
        run: gradle :app:assembleRelease --no-configuration-cache --stacktrace
        continue-on-error: true

      - name: APK'ları yükle
        uses: actions/upload-artifact@v4
        with:
          name: sorumluluk-takibi-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
